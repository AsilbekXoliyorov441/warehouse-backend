name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: stockpulse
          POSTGRES_PASSWORD: stockpulse
          # e2e tests only run against a database whose name ends in _test (see .env.test).
          POSTGRES_DB: stockpulse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U stockpulse -d stockpulse_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install -g npm@11.17.0
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check "{src,test,prisma}/**/*.ts"
      - run: npm run test:unit
      - run: npm run test:e2e
      - run: npm run build && npm run build:seed

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: stockpulse-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
